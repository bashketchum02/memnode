[project]
name = "memnode"
version = "0.1.0"
description = "Personal social graph for engineers - track your network with AI-powered context"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "bashketchum02"}
]
keywords = ["mcp", "knowledge-management", "pkm", "ai", "llm", "notes", "graph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Office/Business :: Scheduling",
]

dependencies = [
    "mcp>=1.0.0",
    "pyyaml>=6.0",
    "python-frontmatter>=1.0.0",
    "typer>=0.24.0",
    "rich>=14.3.3",
    # Smart indexing dependencies (core)
    "watchdog>=4.0.0", # File system monitoring
    "rapidfuzz>=3.0.0", # Fast fuzzy string matching
    "scikit-learn>=1.4.0", # TF-IDF vectorization
    "spacey>=0.1.1",
]

[project.optional-dependencies]
nlp = [
    # spaCy for enhanced NER (Python 3.10-3.13 only, 3.14+ not yet supported)
    "spacy>=3.7.0; python_version < '3.14'",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
]
all = [
    "memnode[nlp]",
]

[project.scripts]
memnode = "src.cli:main"
memnode-server = "src.server:main"
memnode-watch = "src.watcher:main"
memnode-setup = "setup:main"

[project.urls]
Homepage = "https://github.com/bashketchum02/memnode"
Repository = "https://github.com/bashketchum02/memnode"
Documentation = "https://github.com/bashketchum02/memnode#readme"
Issues = "https://github.com/bashketchum02/memnode/issues"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = true
